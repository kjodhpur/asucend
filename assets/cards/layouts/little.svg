<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="asucend {{label}} kids card">
<!-- asucend kids layout (Little Explorers, 6-8). Parent-run profiles only: no links, photos or locations.
     Theme colours, fonts and scene are filled in by scripts/card.py; text is escaped there. -->
<defs>
  <clipPath id="card-clip"><rect width="1080" height="1350" rx="44"/></clipPath>
  <linearGradient id="xp" x1="0" x2="1"><stop stop-color="{{c_accent}}"/><stop offset="1" stop-color="{{c_accent2}}"/></linearGradient>
  <filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.22"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    text{font-family:{{font}};fill:{{c_text}};font-weight:700}
    .head{font-size:26px;letter-spacing:3px;fill:{{c_accent}};stroke:#FFFFFF;stroke-width:9px;paint-order:stroke;stroke-linejoin:round}
    .card{fill:#FFFFFF;filter:url(#lift)}
    .h{font-size:24px;letter-spacing:3px;fill:{{c_accent}}}
    .lvl{font-size:24px;letter-spacing:3px;fill:{{c_text}}}
    .lvlnum{font-size:88px;fill:{{c_text}}}
    .title{font-size:56px;letter-spacing:2px;fill:#FFFFFF}
    .big{font-size:32px}
    .callout{font-size:26px;fill:{{c_accent2}}}
    .muted{font-size:20px;fill:{{c_muted}}}
    .quest{font-size:28px}
    .quest-xp{font-size:24px;fill:{{c_accent}}}
    .check{fill:{{c_accent}}}
    .track-name{font-size:26px}
    .track-xp{font-size:26px}
    .bar-bg{fill:#EEF0F7}
    .medal-glyph{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
    .medal-name{font-size:17px;fill:{{c_text}}}
    .medal-locked{fill:#F3F4F9;stroke:#C9CCDA;stroke-width:4;stroke-dasharray:9 7}
    .medal-locked-text{font-size:36px;fill:#C9CCDA}
    .star-on{fill:{{c_highlight}};stroke:#FFFFFF;stroke-width:1.4;stroke-linejoin:round}
    .star-off{fill:#F1F2F8;stroke:#D3D6E4;stroke-width:0.9;stroke-dasharray:3 2;stroke-linejoin:round}
    .path-line{stroke:#E3E5EF;stroke-width:12;stroke-linecap:round}
    .dot-on{fill:{{c_accent2}};stroke:#FFFFFF;stroke-width:6}
    .dot-off{fill:#F1F2F8;stroke:#D3D6E4;stroke-width:4}
  </style>
</defs>

<rect width="1080" height="1350" rx="44" fill="{{c_background}}"/>
<g clip-path="url(#card-clip)">{{scene}}</g>

<!-- frame -->
<rect x="16" y="16" width="1048" height="1318" rx="38" fill="none" stroke="#FFFFFF" stroke-width="12"/>
<rect x="30" y="30" width="1020" height="1290" rx="28" fill="none" stroke="{{c_accent}}" stroke-width="4" stroke-opacity="0.8"/>

<!-- header -->
<text x="68" y="92" class="head">{{eyebrow}}</text>
<text x="1012" y="92" class="head" text-anchor="end">{{week_label}}</text>

<!-- level badge -->
<g transform="translate(190 272)" filter="url(#lift)">
  <circle r="96" fill="{{c_highlight}}" stroke="#FFFFFF" stroke-width="10"/>
  <circle r="78" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="6 8"/>
  <text y="-30" class="lvl" text-anchor="middle">LEVEL</text>
  <text y="56" class="lvlnum" text-anchor="middle">{{level}}</text>
</g>

<!-- title ribbon -->
<path d="M120 488 L70 512 L120 536Z M960 488 L1010 512 L960 536Z" fill="{{c_accent2}}" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
<rect x="120" y="464" width="840" height="96" rx="48" fill="{{c_accent}}" stroke="#FFFFFF" stroke-width="8" filter="url(#lift)"/>
<text x="540" y="531" class="title" text-anchor="middle">{{title_upper}}</text>

<!-- stars -->
<rect x="70" y="586" width="940" height="334" rx="32" class="card"/>
<text x="110" y="638" class="h">MY STARS THIS WEEK</text>
<text x="970" y="638" class="callout" text-anchor="end">{{stars_label}}</text>
<g transform="translate(180 722)">{{star_chart}}</g>

<!-- path to next level: no numbers for early readers -->
<rect x="70" y="940" width="940" height="150" rx="32" class="card"/>
<text x="110" y="986" class="h">ROAD TO LEVEL {{next_level}}</text>
<g transform="translate(130 1042)">{{progress_path}}</g>
<g transform="translate(940 1036)">
  <path d="M-26 -30 H26 V-6 C26 14 12 24 0 24 C-12 24 -26 14 -26 -6Z" fill="{{c_highlight}}" stroke="#FFFFFF" stroke-width="5"/>
  <path d="M-26 -22 C-44 -22 -44 4 -22 6 M26 -22 C44 -22 44 4 22 6" fill="none" stroke="{{c_highlight}}" stroke-width="6"/>
  <rect x="-16" y="28" width="32" height="12" rx="4" fill="{{c_highlight}}"/>
</g>

<!-- sticker book -->
<rect x="70" y="1110" width="940" height="180" rx="32" class="card"/>
<text x="110" y="1156" class="h">MY STICKERS</text>
<g transform="translate(420 1196)">{{medals}}</g>
</svg>
