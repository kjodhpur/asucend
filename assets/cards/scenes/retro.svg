<g id="scene-retro">
<!-- Pixel Adventure: original stepped-pixel landscape, no borrowed sprites. -->
<defs>
  <linearGradient id="re-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1B2B5A"/><stop offset="0.3" stop-color="#2E5A9C"/><stop offset="0.42" stop-color="#5FA8D3"/><stop offset="0.45" stop-color="#13243A"/><stop offset="1" stop-color="#0B1626"/>
  </linearGradient>
  <pattern id="re-dirt" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="#7A4A2A"/><rect x="0" y="0" width="20" height="20" fill="#86552F"/><rect x="20" y="20" width="20" height="20" fill="#86552F"/><rect x="8" y="26" width="6" height="6" fill="#5E3820"/><rect x="28" y="6" width="6" height="6" fill="#5E3820"/>
  </pattern>
  <pattern id="re-scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity="0.12"/></pattern>
</defs>
<rect width="1080" height="1350" rx="44" fill="url(#re-sky)"/>
<!-- stepped pixel sun -->
<path d="M480 120 H600 V140 H640 V160 H660 V180 H680 V220 H700 V320 H680 V360 H660 V380 H640 V400 H600 V420 H480 V400 H440 V380 H420 V360 H400 V320 H380 V220 H400 V180 H420 V160 H440 V140 H480Z" fill="#F4DF69"/>
<path d="M480 140 H560 V160 H500 V180 H460 V200 H440 V240 H420 V220 H440 V180 H460 V160 H480Z" fill="#FFF6B0"/>
<!-- pixel clouds -->
<g fill="#FFFFFF">
  <path d="M90 180 H130 V160 H190 V180 H230 V200 H250 V220 H70 V200 H90Z"/>
  <path d="M800 140 H840 V120 H900 V140 H940 V160 H960 V180 H780 V160 H800Z"/>
  <path d="M850 280 H880 V265 H920 V280 H950 V295 H830 V280H850Z" opacity="0.8"/>
</g>
<!-- stepped hills -->
<path d="M0 470 V400 H40 V380 H80 V360 H140 V340 H200 V360 H240 V380 H280 V400 H320 V430 H0Z" fill="#2E8B57"/>
<path d="M700 430 V400 H740 V370 H780 V340 H840 V320 H900 V340 H940 V360 H1000 V380 H1080 V430Z" fill="#2E8B57"/>
<path d="M60 400 H100 V380 H140 V360 H160 V380 H120 V400 H60Z M800 360 H840 V340 H880 V360Z" fill="#46B36E"/>
<!-- ground -->
<rect x="0" y="430" width="1080" height="24" fill="#65D9A4"/>
<rect x="0" y="446" width="1080" height="8" fill="#3DAE7A"/>
<rect x="0" y="454" width="1080" height="160" fill="url(#re-dirt)"/>
<rect x="0" y="454" width="1080" height="160" fill="#0B1626" opacity="0.35"/>
<rect x="0" y="560" width="1080" height="60" fill="#0B1626" opacity="0.6"/>
<!-- coins -->
<g fill="#F4DF69"><rect x="150" y="300" width="16" height="24"/><rect x="146" y="304" width="24" height="16"/><rect x="900" y="230" width="16" height="24"/><rect x="896" y="234" width="24" height="16"/></g>
<g fill="#5CF7C8" opacity="0.5"><rect x="80" y="980" width="8" height="8"/><rect x="990" y="860" width="8" height="8"/><rect x="960" y="1250" width="8" height="8"/><rect x="60" y="1290" width="8" height="8"/></g>
<rect width="1080" height="1350" rx="44" fill="url(#re-scan)"/>
</g>
