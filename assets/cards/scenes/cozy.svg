<g id="scene-cozy">
<!-- Cozy Wanderer: original dusk hills, cottage, lanterns and fireflies. -->
<defs>
  <linearGradient id="co-sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1C3B44"/><stop offset="0.25" stop-color="#3D6B6A"/><stop offset="0.38" stop-color="#E8B98A"/><stop offset="0.46" stop-color="#1D3329"/><stop offset="1" stop-color="#14261F"/>
  </linearGradient>
  <radialGradient id="co-lamp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE7B0"/><stop offset="1" stop-color="#FFB38A" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1080" height="1350" rx="44" fill="url(#co-sky)"/>
<circle cx="540" cy="268" r="230" fill="url(#co-lamp)" opacity="0.75"/>
<g fill="#FFF8EC" opacity="0.8"><circle cx="140" cy="120" r="2"/><circle cx="300" cy="80" r="1.5"/><circle cx="820" cy="110" r="2"/><circle cx="950" cy="190" r="1.5"/></g>
