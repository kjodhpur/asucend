<!-- path and lanterns -->
<path d="M470 620 C500 560 600 540 620 470 L650 470 C640 540 560 570 560 620Z" fill="#C9A77A" opacity="0.55"/>
<g><rect x="930" y="430" width="6" height="70" fill="#5A3D2B"/><circle cx="933" cy="426" r="12" fill="#FFD27A"/><circle cx="933" cy="426" r="30" fill="#FFD27A" opacity="0.25"/></g>
