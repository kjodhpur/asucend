  <path d="M-12 30 C-4 38 8 38 14 28" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="-56" y="130" width="112" height="22" rx="8" fill="#5B6CFF"/>
  <rect x="-8" y="70" width="16" height="60" rx="8" fill="#FF6FB5"/>
