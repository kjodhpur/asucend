  <linearGradient id="sp-flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE66D"/><stop offset="1" stop-color="#FF6FB5"/></linearGradient>
</defs>
<rect width="1080" height="1350" rx="44" fill="url(#sp-sky)"/>
<g fill="#FFFFFF">
