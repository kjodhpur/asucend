</g>
<!-- planets -->
<g transform="translate(940 150)"><ellipse rx="86" ry="20" fill="none" stroke="#FFD23F" stroke-width="8" transform="rotate(-18)"/><circle r="52" fill="#FF8FA3"/><path d="M-46 -12 C-10 -2 20 -4 48 -16" stroke="#FFB8C6" stroke-width="10" fill="none"/></g>
<circle cx="390" cy="300" r="28" fill="#5BE0C0"/><circle cx="380" cy="292" r="7" fill="#3CC2A2"/>
