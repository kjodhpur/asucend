  <pattern id="ro-grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0 H0 V60" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/></pattern>
</defs>
<rect width="1080" height="1350" rx="44" fill="url(#ro-sky)"/>
<rect width="1080" height="480" rx="44" fill="url(#ro-grid)"/>
<!-- gears -->
<g fill="#5FC6D6" opacity="0.5">
